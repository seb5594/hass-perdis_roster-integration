<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>PERDIS Duty Roster</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fa8e0"/>
      <stop offset="1" stop-color="#0f4f7d"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ebf2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#062a45" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <!-- roster sheet -->
  <g filter="url(#shadow)">
    <rect x="84" y="104" width="344" height="320" rx="40" fill="url(#sheet)"/>
  </g>
  <path d="M84 144a40 40 0 0 1 40-40h264a40 40 0 0 1 40 40v32H84z" fill="#ff8a3d"/>
  <rect x="152" y="80" width="24" height="60" rx="12" fill="#e9f2f8"/>
  <rect x="336" y="80" width="24" height="60" rx="12" fill="#e9f2f8"/>
  <!-- bus front -->
  <g transform="translate(256 300)">
    <rect x="-92" y="-96" width="184" height="176" rx="30" fill="#1877a5"/>
    <rect x="-70" y="-76" width="140" height="70" rx="14" fill="#bfe6fb"/>
    <rect x="-40" y="-92" width="80" height="12" rx="6" fill="#ffd166"/>
    <circle cx="-56" cy="34" r="14" fill="#ffd166"/>
    <circle cx="56" cy="34" r="14" fill="#ffd166"/>
    <rect x="-22" y="26" width="44" height="16" rx="8" fill="#0f4f7d"/>
    <rect x="-78" y="80" width="34" height="22" rx="8" fill="#0f4f7d"/>
    <rect x="44" y="80" width="34" height="22" rx="8" fill="#0f4f7d"/>
  </g>
  <!-- clock badge -->
  <g transform="translate(396 132)" filter="url(#shadow)">
    <circle r="62" fill="#ffffff"/>
    <circle r="50" fill="none" stroke="#ff8a3d" stroke-width="12"/>
    <path d="M0 -28V0l20 14" fill="none" stroke="#0f4f7d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
